const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.d));
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('l'+'brief'+'pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),e=document.getElementById('e');
f.addEventListener('submit',async ev=>{ev.preventDefault();e.textContent='Opening…';
  try{await open(document.getElementById('p').value)}catch(x){e.textContent='Wrong password.'}});
// same tab, already unlocked: reopen without asking again
const saved=(()=>{try{return sessionStorage.getItem('l'+'brief'+'pw')}catch(e){return null}})();
if(saved) open(saved).catch(()=>{});
</script></body></html>
